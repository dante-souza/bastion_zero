name: Godot validation
on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 headless
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          mv Godot_v4.4.1-stable_linux.x86_64 godot
      - name: Import and check GDScript
        run: ./godot --headless --path . --editor --quit --quit-after 240
      - name: Execute source smoke tests
        run: ./godot --headless --path . --script res://tests/test_smoke.gd
      - name: Confirm project boots
        run: ./godot --headless --path . --quit-after 10
